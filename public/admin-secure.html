<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 פאנל ניהול מאובטח - BizNameForge</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 30px; text-align: center; }
        .login-box, .dashboard-box { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 500px; width: 100%; margin: 50px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #334155; }
        input { width: 85%; padding: 12px; margin: 15px 0; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; text-align: center; font-size: 16px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; width: 90%; }
        button:hover { background: #2563eb; }
        .stat-card { background: #334155; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: right; }
        .message-item { background: #1e293b; border-right: 4px solid #3b82f6; padding: 10px; margin: 8px 0; text-align: right; border-radius: 4px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. מסך התחברות מאובטח -->
    <div id="loginSection" class="login-box">
        <h2>🔒 כניסת מנהל מערכת</h2>
        <p>הזן סיסמה כדי למשוך נתונים משרת ה-Backend:</p>
        <input type="password" id="passInput" placeholder="הקלד סיסמת אדמין...">
        <button onclick="loginAdmin()">התחבר למערכת</button>
    </div>

    <!-- 2. דשבורד הנתונים והצ'אטים (נסתר עד להתחברות מוצלחת) -->
    <div id="dashSection" class="dashboard-box hidden">
        <h2>📊 דשבורד ניהול רשמי</h2>
        <p>מחובר לשרת בהצלחה ✅</p>
        
        <div class="stat-card">📈 כניסות לאתר: <strong id="statViews">0</strong></div>
        <div class="stat-card">📥 הורדות: <strong id="statDownloads">0</strong></div>
        <div class="stat-card">💰 רכישות פרימיום: <strong id="statPremium">0</strong></div>

        <h3>💬 שיחות אחרונות מהצ'אט (AI):</h3>
        <div id="messagesList">אין הודעות חדשות בשרת.</div>
        <br>
        <button onclick="logoutAdmin()" style="background: #ef4444;">נתק מערכת</button>
    </div>

    <script>
        async function loginAdmin() {
            const password = document.getElementById('passInput').value;
            try {
                   const response = await fetch('/api/admin/login', {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });

                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashSection').classList.remove('hidden');
                    loadData();
                } else { alert("❌ " + data.error); }
            } catch (e) { alert("❌ שגיאה בחיבור לשרת"); }
        }

        async function loadData() {
            const token = localStorage.getItem('adminToken');
            try {
                const response = await fetch('/api/admin/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                // עדכון מדדים על המסך
                document.getElementById('statViews').innerText = data.stats.views;
                document.getElementById('statDownloads').innerText = data.stats.downloads;
                document.getElementById('statPremium').innerText = data.stats.purchases.premium;

                // הצגת הודעות צ'אט
                const list = document.getElementById('messagesList');
                if (data.messages.length > 0) {
                    list.innerHTML = data.messages.map(m => `
                        <div class="message-item">
                            <strong>${m.sender === 'user' ? '👤 לקוח' : '🤖 בוט AI'}:</strong> ${m.text}
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        function logoutAdmin() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>
