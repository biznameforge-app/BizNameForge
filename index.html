<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070a16">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BizNameForge">
<title>BizNameForge – מחולל שמות לעסקים</title>
<style>
:root{
  --bg:#070a16; --panel:#0f1530; --line:#27305a; --ink:#eef1ff; --mute:#9aa4cf;
  --a:#38bdf8; --b:#8b5cf6; --field:#0a0f24;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:32px 16px; color:var(--ink);
  font-family:"Heebo","Assistant",Arial,sans-serif;
  background:radial-gradient(circle at top,#1b1f55 0%,var(--bg) 55%);
  display:flex; justify-content:center; align-items:flex-start;
}
.app{
  width:100%; max-width:680px; padding:36px 28px;
  background:rgba(15,21,48,.9); border:1px solid var(--line);
  border-radius:20px; box-shadow:0 0 50px rgba(59,130,246,.14);
}
h1{
  margin:0 0 8px; text-align:center; font-size:clamp(38px,8vw,58px); line-height:1.1;
  background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  direction:ltr;
}
.sub{margin:0 0 28px; text-align:center; color:var(--mute); font-size:18px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:block; margin:0 0 6px; font-size:14px; color:var(--mute)}
.field{margin-bottom:16px}
select,input{
  width:100%; padding:13px 14px; font:inherit; font-size:16px; color:var(--ink);
  background:var(--field); border:1px solid var(--line); border-radius:10px;
  outline:none; transition:border-color .2s, box-shadow .2s;
}
select:disabled{opacity:.5; cursor:not-allowed}
select:focus,input:focus{border-color:var(--a); box-shadow:0 0 0 3px rgba(56,189,248,.22)}
option{background:var(--field); color:var(--ink)}
.go{
  width:100%; margin-top:4px; padding:15px; border:0; border-radius:10px; cursor:pointer;
  font:inherit; font-size:18px; font-weight:700; color:#fff;
  background:linear-gradient(90deg,#2563eb,var(--b)); transition:transform .15s, opacity .2s;
}
.go:hover:not(:disabled){transform:translateY(-1px)}
.go:disabled{opacity:.45; cursor:not-allowed}
:focus-visible{outline:2px solid var(--a); outline-offset:2px}
.hint{min-height:22px; margin:12px 0 0; text-align:center; color:#fca5a5; font-size:14px}
#results{margin-top:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(max-width:560px){#results{grid-template-columns:1fr}}
.card{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; background:#111936; border:1px solid var(--line); border-radius:10px;
}
.card span{font-size:18px; color:#bfdbfe; overflow-wrap:anywhere}
.copy{
  flex:none; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer;
  color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px;
}
.copy:hover{border-color:var(--a)}
.foot{margin:26px 0 0; text-align:center; color:#64709e; font-size:13px; direction:ltr}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
@media(max-width:560px){.plans{grid-template-columns:1fr}}
.plan{text-align:start;padding:14px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.plan[aria-pressed="true"]{border-color:var(--a);box-shadow:0 0 0 2px rgba(56,189,248,.25)}
.plan b{display:block;font-size:18px}
.plan .price{display:block;margin:2px 0 8px;color:var(--a);font-size:14px}
.plan ul{margin:0;padding:0;padding-inline-start:16px;color:var(--mute);font-size:13px;line-height:1.6}
.promo{width:100%;margin:0 0 22px;border-radius:14px;border:1px solid var(--line);background:#000}
.card .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.card small{color:var(--mute);font-size:12px}
.acts{display:flex;gap:6px;flex:none}
.star[aria-pressed="true"]{color:#facc15;border-color:#facc15}
#favs{margin-top:22px}
#favs h2{margin:0 0 10px;font-size:16px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#111936;color:#fde68a;font-size:15px}
.all{margin-top:10px;width:auto;padding:8px 14px;font-size:14px;font-weight:400;background:transparent;border:1px solid var(--line)}
.bar{display:flex;justify-content:flex-end;margin-bottom:6px}.lang{padding:6px 12px;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}

.demo{margin:0 0 22px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0a0f24}
.screen{display:grid;gap:10px;min-height:250px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);position:relative}
.dsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsel span,.dinput{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--mute);font-size:15px;transition:border-color .3s,color .3s}
.dsel span.on,.dinput.on{border-color:var(--a);color:var(--ink)}
.dinput{min-height:42px}
.cur{display:inline-block;width:2px;height:1em;margin:0 2px;vertical-align:middle;background:var(--a);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.dbtn{padding:11px;text-align:center;border-radius:8px;font-weight:700;background:linear-gradient(90deg,#2563eb,var(--b));transition:transform .2s}
.dbtn.press{transform:scale(.96)}
.dnames{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dn{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#111936;color:#bfdbfe;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.dn.show{opacity:1;transform:none}
.dn.fav{border-color:#facc15;color:#fde68a}
.dn.fav::after{content:" ★";color:#facc15}
.dlogo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(28px,7vw,42px);font-weight:800;background:var(--panel);border-radius:10px;color:var(--a)}
.dlogo.show{display:flex}
.cap{min-height:48px;margin:12px 0 8px;text-align:center;font-size:17px;color:var(--ink)}
.dctl{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--mute);font-size:14px}
.layout{display:flex;gap:20px;align-items:flex-start;justify-content:center;width:100%;max-width:1040px}
.layout .app{flex:1 1 560px;min-width:0}
.side{flex:0 0 300px;position:sticky;top:20px}
.trial{margin:0 0 12px;padding:10px 12px;border:1px solid var(--a);border-radius:10px;background:rgba(56,189,248,.08);color:var(--ink);font-size:14px;line-height:1.5}
.sidetitle{margin:0 0 12px;font-size:18px;color:var(--ink)}
.side .plans{grid-template-columns:1fr;margin:0}
.plan{cursor:default}
.plan.on{border-color:var(--a);box-shadow:0 0 0 2px rgba(56,189,248,.25)}
.plan:last-child{background:linear-gradient(160deg,#1a1650,var(--field))}
.up{width:100%;margin-top:12px;padding:10px;font:inherit;font-size:15px;font-weight:700;color:#fff;border:0;border-radius:9px;cursor:pointer;background:linear-gradient(90deg,#2563eb,var(--b))}
.up:disabled{cursor:default;background:transparent;border:1px solid var(--line);color:var(--mute)}
@media(max-width:900px){.layout{flex-direction:column;align-items:center}.side{flex:none;width:100%;max-width:680px;position:static}}
</style>
</head>
<body>
<div class="layout">
<main class="app">
  <div class="bar"><button id="inst" class="lang" type="button" data-t="inst" hidden style="margin-inline-end:8px"></button><button id="lang" class="lang" type="button"></button></div>
  <h1>BizNameForge</h1>
  <p class="sub" data-t="sub"></p>
    <section class="demo" aria-label="Demo / הדגמה">
    <div class="screen" id="dScreen">
      <div class="dsel"><span id="dCat"></span><span id="dSub"></span></div>
      <div class="dinput" id="dIn"><span id="dType"></span><i class="cur"></i></div>

  <video class="promo" src="promo.mp4" controls playsinline preload="metadata" onerror="this.remove()"></video>

  <div class="row">
    <div class="field">
      <label for="category" data-t="cat"></label>
      <select id="category"></select>
    </div>
    <div class="field">
      <label for="subcategory" data-t="subcat"></label>
      <select id="subcategory" disabled></select>
    </div>
  </div>

  <div class="field">
    <label for="keyword" data-t="kw"></label>
    <input id="keyword" type="text" maxlength="20">
  </div>

  <button id="go" class="go" type="button" disabled></button>
  <p id="hint" class="hint" role="status"></p>
  <div id="results" aria-live="polite"></div>

  <p class="foot">BizNameForge — Turn ideas into names.</p>
</main>
<aside class="side"><h2 class="sidetitle" data-t="upg"></h2><p class="trial" data-t="trial"></p><div class="plans" id="plans" role="group"></div></aside>
</div>

Object.values(DATA).forEach(c=>Object.entries(c.subs).forEach(([k,s])=>s.core=CORE[k]||s.label));

const SUF_EN=["House","Lab","Studio","Corner","Co.","Club","Works","Point"];
const EN={

let lang="en",plan="free"; const favs=[];
try{const l=localStorage.getItem("bnf_lang");lang=l||((navigator.language||"").toLowerCase().startsWith("he")?"he":"en");}catch(e){}
const $=id=>document.getElementById(id);
const catEl=$("category"),subEl=$("subcategory"),kwEl=$("keyword"),goBtn=$("go"),hint=$("hint"),results=$("results");
const cur=()=>lang==="he"?DATA:END, tx=()=>T[lang];
const shuffle=a=>[...a].sort(()=>Math.random()-.5), pick=a=>a[Math.floor(Math.random()*a.length)];
const today=()=>new Date().toISOString().slice(0,10);
function usedToday(){try{const d=JSON.parse(localStorage.getItem("bnf")||"{}");return d.d===today()?d.c:0;}catch(e){return 0;}}
function bump(){try{localStorage.setItem("bnf",JSON.stringify({d:today(),c:usedToday()+1}));}catch(e){}}
function flash(b,txt,orig){b.textContent=txt;setTimeout(()=>b.textContent=orig,1500);}
async function copyTo(b,text,orig){try{await navigator.clipboard.writeText(text);flash(b,tx().ok,orig);}catch(e){flash(b,tx().fail,orig);}}

function fill(sel,ph,items){
  sel.innerHTML=""; const f=new Option(ph,"",true,true); f.disabled=true; sel.add(f);
  items.forEach(([v,t])=>sel.add(new Option(t,v)));
}

function renderPlans(){
  const box=$("plans"); box.innerHTML="";
  Object.keys(PLANS).forEach(k=>{
    const [name,price,perks]=tx().pl[k], t=tx();
    const c=document.createElement("div"); c.className="plan"+(k===plan?" on":"");
    c.innerHTML="<b>"+name+'</b><span class="price">'+price+"</span><ul>"+perks.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
    const b=document.createElement("button"); b.type="button"; b.className="up"; b.disabled=(k===plan);
    b.textContent=k===plan?t.cur:(k==="free"?t.dg:t.up);
    b.addEventListener("click",()=>{if(CHECKOUT[k]){window.open(CHECKOUT[k],"_blank","noopener");return;}plan=k;renderPlans();renderFavs();results.innerHTML="";hint.textContent="";goBtn.textContent=tx().go;});
    c.append(b); box.append(c);
  });
}

function applyLang(){
  const t=tx(),h=document.documentElement;
  h.lang=lang; h.dir=t.dir; document.title=t.title;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  kwEl.placeholder=t.ph; $("plans").setAttribute("aria-label",t.plans); $("lang").textContent=t.other;
  fill(catEl,t.pc,Object.entries(cur()).map(([k,v])=>[k,v.label]));
  fill(subEl,t.pf,[]); subEl.disabled=true; goBtn.disabled=true; goBtn.textContent=t.go;
  results.innerHTML=""; hint.textContent=""; renderPlans(); renderFavs();
}

function buildNames(cat,sub,kw,p){
  let out=[];
  if(kw&&p.kw){const c=[]; cat.pre.forEach(x=>c.push(lang==="he"?x+" "+kw:x+" "+kw)); cat.suf.forEach(x=>c.push(kw+" "+x)); out.push(...shuffle(c).slice(0,6));}
  out.push(...shuffle(sub.names));
  if(p.extra) out.push(...shuffle(EN_A).slice(0,6).map(a=>a+" "+pick(EN_B)));
  if(lang==="he") out.push(...shuffle(MODS).slice(0,6).map(m=>sub.core+" "+m));
  else out.push(...shuffle(PRE_EN).slice(0,3).map(x=>x+" "+sub.core),...shuffle(SUF_EN).slice(0,3).map(x=>sub.core+" "+x));
  return shuffle([...new Set(out)].slice(0,p.n));
}

function render(names,p){
  results.innerHTML=""; const t=tx();
  names.forEach(name=>{
    const card=document.createElement("div"); card.className="card";
    const box=document.createElement("div"); box.className="txt";
    const s=document.createElement("span"); s.textContent=name; box.append(s);
    if(p.extra){const sm=document.createElement("small"); sm.textContent=pick(t.slog); box.append(sm);}
    const acts=document.createElement("div"); acts.className="acts";
    const cp=document.createElement("button"); cp.type="button"; cp.className="copy"; cp.textContent=t.copy;
    cp.addEventListener("click",()=>copyTo(cp,name,t.copy)); acts.append(cp);
    if(p.fav){
      const st=document.createElement("button"); st.type="button"; st.className="copy star"; st.textContent="★";
      st.setAttribute("aria-label",t.save); st.setAttribute("aria-pressed",favs.includes(name));
      st.addEventListener("click",()=>{const i=favs.indexOf(name); i>-1?favs.splice(i,1):favs.push(name); st.setAttribute("aria-pressed",favs.includes(name)); renderFavs();});
      acts.append(st);
    }
    card.append(box,acts); results.append(card);
  });
}

function renderFavs(){
  const box=$("favs"),p=PLANS[plan],t=tx(); box.innerHTML="";
  if(!p.fav||!favs.length) return;
  const h=document.createElement("h2"); h.textContent=t.favs;
  const ch=document.createElement("div"); ch.className="chips";
  favs.forEach(f=>{const c=document.createElement("span"); c.className="chip"; c.textContent=f; ch.append(c);});
  box.append(h,ch);
  if(p.extra){const a=document.createElement("button"); a.type="button"; a.className="go all"; a.textContent=t.all; a.addEventListener("click",()=>copyTo(a,favs.join("\n"),t.all)); box.append(a);}
}

catEl.addEventListener("change",()=>{
  fill(subEl,tx().ps,Object.entries(cur()[catEl.value].subs).map(([k,v])=>[k,v.label]));
  subEl.disabled=false; goBtn.disabled=true; results.innerHTML=""; hint.textContent=""; goBtn.textContent=tx().go;
});
subEl.addEventListener("change",()=>{goBtn.disabled=false;hint.textContent="";});
goBtn.addEventListener("click",()=>{
  const t=tx();
  if(!catEl.value||!subEl.value){hint.textContent=t.need;return;}
  const p=PLANS[plan];
  if(usedToday()>=p.daily){hint.textContent=t.lim.replace("{n}",p.daily);return;}
  const kw=kwEl.value.trim(), cat=cur()[catEl.value];
  hint.textContent=(kw&&!p.kw)?t.kwl:"";
  render(buildNames(cat,cat.subs[subEl.value],kw,p),p);
  if(p.daily!==Infinity) bump();
  goBtn.textContent=t.more;
});
kwEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!goBtn.disabled)goBtn.click();});
$("lang").addEventListener("click",()=>{lang=lang==="he"?"en":"he"; try{localStorage.setItem("bnf_lang",lang);}catch(e){} applyLang();});

let demoRun=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const say=(d,i)=>{
  $("dCap").textContent=d.caps[i];
  if($("dVoice").checked&&"speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.caps[i]);u.lang=d.v;speechSynthesis.speak(u);}
};
async function playPart(d){
  const sc=$("dScreen"),cat=$("dCat"),sub=$("dSub"),inp=$("dIn"),ty=$("dType"),btn=$("dBtn"),nm=$("dNames"),lg=$("dLogo");
  sc.dir=d.dir; $("dCap").dir=d.dir;
  [cat,sub,inp].forEach(e=>e.classList.remove("on"));
  cat.textContent=d.cat.replace(/./g,"•").slice(0,0)||"—"; sub.textContent="—"; ty.textContent=""; btn.textContent=d.btn; nm.innerHTML=""; lg.classList.remove("show"); lg.textContent="";
  say(d,0); await wait(3200);
  say(d,1); cat.textContent=d.cat; cat.classList.add("on"); await wait(1200); sub.textContent=d.sub; sub.classList.add("on"); await wait(2200);
  say(d,2); inp.classList.add("on");
  for(const ch of d.type){ty.textContent+=ch; await wait(220);}
  await wait(900); btn.classList.add("press"); await wait(250); btn.classList.remove("press"); await wait(500);
  say(d,3);
  const items=d.names.map(n=>{const e=document.createElement("div");e.className="dn";e.textContent=n;nm.append(e);return e;});
  for(const e of items){await wait(600);e.classList.add("show");}
  await wait(1400); items[0].classList.add("fav"); await wait(2200);
  say(d,4); lg.textContent="BizNameForge"; lg.classList.add("show"); await wait(3800);
}
$("dPlay").addEventListener("click",async()=>{
  if(demoRun) return; demoRun=true; const b=$("dPlay"); b.disabled=true;
  try{await playPart(DEMO.en); await playPart(DEMO.he);}finally{
    if("speechSynthesis" in window) speechSynthesis.cancel();
    demoRun=false; b.disabled=false; b.textContent="↻ Replay · שוב";
  }
});
